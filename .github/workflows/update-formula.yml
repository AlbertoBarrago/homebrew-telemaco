name: Update formulas

on:
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve latest release
        id: release
        run: |
          TAG=$(gh release list --repo AlbertoBarrago/telemaco --limit 1 --json tagName --jq '.[0].tagName')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved latest release: $TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download macOS tarballs
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          mkdir -p dist
          for VARIANT in "" "-stealth"; do
            for ARCH in aarch64 x86_64; do
              gh release download "$TAG" --repo AlbertoBarrago/telemaco \
                --pattern "telemaco-${ARCH}-macos${VARIANT}.tar.gz" \
                --dir dist --clobber
            done
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compute checksums
        id: checksums
        run: |
          cd dist
          echo "aarch64=$(shasum -a 256 telemaco-aarch64-macos.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64=$(shasum -a 256 telemaco-x86_64-macos.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "aarch64_stealth=$(shasum -a 256 telemaco-aarch64-macos-stealth.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x86_64_stealth=$(shasum -a 256 telemaco-x86_64-macos-stealth.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update formulas
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          AARCH64="${{ steps.checksums.outputs.aarch64 }}"
          X86_64="${{ steps.checksums.outputs.x86_64 }}"
          AARCH64_STEALTH="${{ steps.checksums.outputs.aarch64_stealth }}"
          X86_64_STEALTH="${{ steps.checksums.outputs.x86_64_stealth }}"

          python3 - "$TAG" "$AARCH64" "$X86_64" "$AARCH64_STEALTH" "$X86_64_STEALTH" <<'PY'
          import re, sys
          tag, a64, x64, a64s, x64s = sys.argv[1:6]
          def update(path, aarch64, x86_64):
              with open(path) as f:
                  text = f.read()
              text = re.sub(r"/releases/download/v[0-9.]+/", f"/releases/download/{tag}/", text)
              # Three sha256 lines in order: top-level url, on_arm, on_intel.
              # The top-level and on_arm both carry the arm checksum; on_intel
              # carries the x86_64 one.
              hashes = re.findall(r'sha256 "([0-9a-f]{64})"', text)
              if len(hashes) != 3:
                  raise SystemExit(f"expected 3 sha256 in {path}, found {len(hashes)}")
              text = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{aarch64}"', text, count=2)
              text = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{x86_64}"', text, count=1)
              with open(path, "w") as f:
                  f.write(text)
          update("Formula/telemaco.rb", a64, x64)
          update("Formula/telemaco-stealth.rb", a64s, x64s)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/
          if git diff --cached --quiet; then
            echo "No formula changes; nothing to commit."
            exit 0
          fi
          git commit -m "Update formulas to ${{ steps.release.outputs.tag }}"
          git push
